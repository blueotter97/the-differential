var idx = 0;
var graveCount = 0;
var mistakeCount = 0;
var startTime = Date.now();
var timerInterval = null;
var finalTime = "00:00";
var currentChoices = [];

var storyEl = document.getElementById('story');
var choicesEl = document.getElementById('choices');
var feedbackEl = document.getElementById('feedback');
var fbTag = document.getElementById('fb-tag');
var fbText = document.getElementById('fb-text');
var continueBtn = document.getElementById('continue-btn');
var tagEl = document.getElementById('tag');
var progressEl = document.getElementById('progress');
var endEl = document.getElementById('end');
var mainEl = document.getElementById('main');
var vitalsEl = document.getElementById('vitals');
var timerLabel = document.getElementById('timer');
var vHr = document.getElementById('v-hr');
var vBp = document.getElementById('v-bp');
var vSpo2 = document.getElementById('v-spo2');
var vRhythm = document.getElementById('v-rhythm');

function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function pickRandom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function formatTime(totalSeconds){
  var m = Math.floor(totalSeconds/60);
  var s = totalSeconds % 60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function tickTimer(){
  var elapsed = Math.floor((Date.now() - startTime)/1000);
  timerLabel.textContent = formatTime(elapsed);
}
function startTimer(){
  startTime = Date.now();
  timerLabel.textContent = "00:00";
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 500);
}
function stopTimer(){
  var elapsed = Math.floor((Date.now() - startTime)/1000);
  finalTime = formatTime(elapsed);
  if (timerInterval) clearInterval(timerInterval);
}

function buildProgress(){
  progressEl.innerHTML = '';
  for (var i=0;i<steps.length;i++){
    var s = document.createElement('span');
    progressEl.appendChild(s);
  }
}

function renderVitals(v){
  vHr.textContent = v.hr;
  vBp.textContent = v.bp;
  vSpo2.textContent = v.spo2;
  vRhythm.textContent = v.rhythm;
  vRhythm.className = 'stat-value' + (v.rhythmState ? ' ' + v.rhythmState : '');
  vitalsEl.classList.remove('pulse');
  void vitalsEl.offsetWidth;
  vitalsEl.classList.add('pulse');
  setTimeout(function(){ vitalsEl.classList.remove('pulse'); }, 400);
}

function renderStep(){
  var step = steps[idx];
  tagEl.textContent = 'Step ' + (idx+1) + ' of ' + steps.length;
  var dots = progressEl.children;
  for (var i=0;i<dots.length;i++){ dots[i].classList.toggle('done', i <= idx); }

  renderVitals(step.baseVitals);

  var html = step.story;
  if (step.isPuzzle){
    html += '<table class="punnett"><tr><td></td><td class="allele">A</td><td class="allele">O</td></tr>' +
      '<tr><td class="allele">B</td><td class="cell">' + step.punnett.grid[0][0] + '</td><td class="cell">' + step.punnett.grid[0][1] + '</td></tr>' +
      '<tr><td class="allele">O</td><td class="cell">' + step.punnett.grid[1][0] + '</td><td class="cell">' + step.punnett.grid[1][1] + '</td></tr></table>';
  }
  storyEl.innerHTML = html;

  feedbackEl.className = 'feedback';
  feedbackEl.classList.remove('show');
  continueBtn.style.display = 'none';

  var built = ['good','neutral','grave'].map(function(tagName){
    var t = step.tags[tagName];
    var v = pickRandom(t.variants);
    return { tag: tagName, label: v.label, fb: v.fb, vitals: t.vitals };
  });
  currentChoices = shuffle(built);

  choicesEl.innerHTML = '';
  currentChoices.forEach(function(choice, i){
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.label;
    btn.onclick = function(){ pick(i); };
    choicesEl.appendChild(btn);
  });
}

function pick(i){
  var choice = currentChoices[i];
  var btns = choicesEl.querySelectorAll('.choice-btn');
  btns.forEach(function(b, j){
    b.disabled = true;
    if (j === i) b.classList.add('picked');
  });

  feedbackEl.className = 'feedback show ' + choice.tag;
  fbTag.textContent = choice.tag === 'good' ? 'Good call' : (choice.tag === 'grave' ? 'Serious mistake' : 'Close, but not quite');
  fbText.textContent = choice.fb;

  renderVitals(choice.vitals);

  if (choice.tag === 'grave') graveCount++;
  if (choice.tag !== 'good') mistakeCount++;

  continueBtn.style.display = 'block';
  continueBtn.onclick = next;
}

function next(){
  idx++;
  if (idx >= steps.length){
    finish();
  } else {
    renderStep();
  }
}

function finish(){
  stopTimer();
  mainEl.style.display = 'none';
  progressEl.style.display = 'none';
  vitalsEl.style.display = 'none';
  endEl.classList.add('show');
  var titleEl = document.getElementById('end-title');
  var subEl = document.getElementById('end-sub');
  var timeEl = document.getElementById('end-time');
  timeEl.textContent = "Diagnosed in " + finalTime;

  if (graveCount >= 3){
    titleEl.textContent = "You lost him.";
    subEl.textContent = "Too many critical mistakes in a row cost Mr. Okafor his life. In a real code, each of those calls compounds — that's why the sequence matters as much as any single decision.";
  } else if (mistakeCount === 0){
    titleEl.textContent = "Mr. Okafor survives — clean run.";
    subEl.textContent = "Every call was right. He's headed to the ICU stable, and the next team knows exactly what happened in that room.";
  } else {
    titleEl.textContent = "Mr. Okafor survives.";
    subEl.textContent = "He made it — but a few of your calls (" + mistakeCount + " total) cost him time or added risk along the way. Play again and see if you can get a clean run.";
  }
}

function restart(){
  idx = 0; graveCount = 0; mistakeCount = 0;
  mainEl.style.display = 'flex';
  progressEl.style.display = 'flex';
  vitalsEl.style.display = 'grid';
  endEl.classList.remove('show');
  startTimer();
  renderStep();
}

buildProgress();
startTimer();
renderStep();
</script>
