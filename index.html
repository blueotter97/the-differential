<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Differential</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:      #0b0d0c;
    --bg2:     #14100f;
    --card:    #17130f;
    --line:    rgba(255,240,220,0.09);
    --text:    #f1ead9;
    --muted:   #8d8578;
    --red:     #e0473a;
    --red-dim: #6b241d;
  }
  html.light{
    --bg:      #f3ede0;
    --bg2:     #ece3d1;
    --card:    #fffaf0;
    --line:    rgba(40,25,10,0.12);
    --text:    #1b1611;
    --muted:   #6b6154;
    --red:     #c1362a;
    --red-dim: #e3a89f;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family:'DM Sans', -apple-system, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .screen{
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* NAV */
  nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 1.2rem 1.5rem 0.9rem;
    flex-shrink:0;
  }
  .logo{
    font-family:'Playfair Display', serif;
    font-size:16px;
    letter-spacing:0.01em;
  }
  .theme-toggle{
    background:transparent;
    border:1px solid var(--line);
    border-radius:20px;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color: var(--muted);
    cursor:pointer;
  }
  .theme-toggle svg{ width:14px; height:14px; }

  /* EKG SIGNATURE ELEMENT */
  .pulse-wrap{
    flex-shrink:0;
    height:64px;
    width:100%;
    position:relative;
    overflow:hidden;
    margin: 0.4rem 0 0.6rem;
  }
  .pulse-wrap svg{ width:200%; height:100%; display:block; }
  .pulse-line{
    fill:none;
    stroke: var(--red);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    animation: pulse-scroll 6s linear infinite;
  }
  @keyframes pulse-scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .pulse-line{ animation:none; }
  }

  /* HERO TEXT */
  .headline{
    flex-shrink:0;
    padding: 0 1.5rem;
    margin-bottom: clamp(1rem, 4vh, 2.2rem);
  }
  .headline h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size: clamp(30px, 8vw, 46px);
    line-height:1.08;
    letter-spacing:-0.01em;
    max-width: 480px;
  }
  .headline p{
    color: var(--muted);
    font-size:14px;
    margin-top:0.6rem;
    max-width: 320px;
  }

  /* CARD STACK */
  .stage{
    flex:1;
    position:relative;
    padding: 0 1.5rem;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    min-height:0;
  }
  .deck{
    position:relative;
    width:100%;
    max-width:380px;
    height:100%;
    max-height: 440px;
  }
  .card{
    position:absolute;
    inset:0;
    border-radius:18px;
    border:1px solid var(--line);
    background: var(--card);
    padding: 1.6rem 1.5rem;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    touch-action: pan-y;
    user-select:none;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5);
  }
  .card.locked{
    z-index:1;
    transform: scale(0.94) translateY(14px);
    opacity:0.55;
  }
  .card.active{
    z-index:2;
  }
  .card.dragging{ transition:none; }

  .card-spec{
    font-size:11px;
    letter-spacing:0.06em;
    color: var(--red);
    margin-bottom:0.6rem;
    font-weight:500;
  }
  .card-title{
    font-family:'Playfair Display', serif;
    font-size:24px;
    line-height:1.25;
    margin-bottom:0.55rem;
  }
  .card-sub{
    font-size:13px;
    color: var(--muted);
    line-height:1.6;
    margin-bottom:1.3rem;
  }
  .card-cta{
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:500;
    color: var(--bg);
    background: var(--text);
    border:none;
    border-radius:999px;
    padding:10px 20px;
    cursor:pointer;
    text-decoration:none;
  }
  .card.locked .card-cta{
    background: transparent;
    color: var(--muted);
    border:1px solid var(--line);
  }
  .lock-badge{
    position:absolute;
    top:1.2rem; right:1.2rem;
    font-size:10px;
    letter-spacing:0.04em;
    color: var(--muted);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 9px;
  }

  /* SWIPE HINT */
  .swipe-hint{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 1rem 0 1.4rem;
    color: var(--muted);
    font-size:11px;
    letter-spacing:0.04em;
  }
  .swipe-hint svg{ width:14px; height:14px; animation: nudge 1.8s ease-in-out infinite; }
  @keyframes nudge{
    0%,100%{ transform: translateX(0); opacity:0.5; }
    50%{ transform: translateX(4px); opacity:1; }
  }

  .dots{
    display:flex; gap:6px;
    justify-content:center;
    padding-bottom: 1.4rem;
    flex-shrink:0;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--line);
  }
  .dot.on{ background: var(--red); }
</style>
</head>
<body>
<div class="screen">
  <nav>
    <span class="logo">The Differential</span>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" aria-label="Toggle theme">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </nav>

  <div class="pulse-wrap">
    <svg viewBox="0 0 600 64" preserveAspectRatio="none">
      <path class="pulse-line" d="M0,32 L60,32 L80,32 L92,10 L104,54 L116,32 L136,32 L150,32 L162,18 L174,32 L300,32 L360,32 L380,32 L392,10 L404,54 L416,32 L436,32 L450,32 L462,18 L474,32 L600,32
        L660,32 L680,32 L692,10 L704,54 L716,32 L736,32 L750,32 L762,18 L774,32 L900,32 L960,32 L980,32 L992,10 L1004,54 L1016,32 L1036,32 L1050,32 L1062,18 L1074,32 L1200,32" />
    </svg>
  </div>

  <div class="headline">
    <h1>You're the doctor now.</h1>
    <p>Pick a case. Every choice changes what happens next.</p>
  </div>

  <div class="stage">
    <div class="deck" id="deck">
      <div class="card locked" id="card-next">
        <span class="lock-badge">More soon</span>
        <p class="card-spec">Next specialty</p>
        <h2 class="card-title">TBD</h2>
        <p class="card-sub">New cases are on the way.</p>
        <span class="card-cta">Locked</span>
      </div>
      <div class="card active" id="card-cardio">
        <p class="card-spec">Cardiology</p>
        <h2 class="card-title">Flatline at 2:47am</h2>
        <p class="card-sub">Your patient just coded. You've got seconds to get it right.</p>
        <a class="card-cta" href="episodes/01-vfib.html">Play &rarr;</a>
      </div>
    </div>
  </div>

  <div class="swipe-hint">
    <span>Swipe for what's next</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
  <div class="dots">
    <span class="dot on"></span>
    <span class="dot"></span>
  </div>
</div>

<script>
  function toggleTheme(){
    var html = document.documentElement;
    var isLight = html.classList.contains('light');
    html.classList.toggle('light', !isLight);
    html.classList.toggle('dark', isLight);
    localStorage.setItem('theme', isLight ? 'dark' : 'light');
  }
  (function(){
    if (localStorage.getItem('theme') === 'light'){
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
    }
  })();

  // Simple swipe: drag the active card away to reveal the locked one, release to snap back
  (function(){
    var active = document.getElementById('card-cardio');
    var dots = document.querySelectorAll('.dot');
    var startX = 0, dx = 0, dragging = false;

    function onStart(x){ dragging = true; startX = x; active.classList.add('dragging'); }
    function onMove(x){
      if(!dragging) return;
      dx = x - startX;
      var clamped = Math.max(Math.min(dx, 0), -260);
      active.style.transform = 'translateX(' + clamped + 'px) rotate(' + (clamped/26) + 'deg)';
      active.style.opacity = 1 - Math.min(Math.abs(clamped)/260, 1) * 0.6;
      dots[0].classList.toggle('on', clamped > -130);
      dots[1].classList.toggle('on', clamped <= -130);
    }
    function onEnd(){
      if(!dragging) return;
      dragging = false;
      active.classList.remove('dragging');
      active.style.transform = '';
      active.style.opacity = '';
      dots[0].classList.add('on');
      dots[1].classList.remove('on');
      dx = 0;
    }

    active.addEventListener('touchstart', function(e){ onStart(e.touches[0].clientX); }, {passive:true});
    active.addEventListener('touchmove', function(e){ onMove(e.touches[0].clientX); }, {passive:true});
    active.addEventListener('touchend', onEnd);

    active.addEventListener('mousedown', function(e){ onStart(e.clientX); });
    window.addEventListener('mousemove', function(e){ onMove(e.clientX); });
    window.addEventListener('mouseup', onEnd);
  })();
</script>
</body>
</html>
